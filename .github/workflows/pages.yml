# Публикация статического сайта (index.html, css/, js/, img/) на GitHub Pages.
# Сборки нет: файлы собираются в _site и отдаются как есть.
# Публикуется только содержимое сайта — prototype/ и .scratch/ в артефакт не попадают.
#
# ПРЕДУСЛОВИЕ (один раз, вручную): Settings → Pages → Build and deployment →
# Source: **GitHub Actions**. Штатный GITHUB_TOKEN не может включить Pages сам
# (параметр enablement у configure-pages требует отдельный PAT), поэтому до этого
# шага `configure-pages` падает с "Get Pages site failed: Not Found".
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html css js _site/
          if [ -d img ]; then cp -r img _site/; fi

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
